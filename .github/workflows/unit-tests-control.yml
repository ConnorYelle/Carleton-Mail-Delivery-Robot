name: Control Layer Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, test/control-unit-tests ]

jobs:
  control-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Add src to PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd)/mail-delivery-robot/src" >> $GITHUB_ENV

      - name: Run control unit tests
        run: |
          pytest \
            mail-delivery-robot/src/tests/action_translator.py \
            mail-delivery-robot/src/tests/report_generator.py \
            --cov=control
