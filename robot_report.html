<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robot Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f4f4f4;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .metric-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #555;
        }

        .metric-value {
            font-size: 1.4em;
            margin-top: 5px;
            color: #222;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .highlight {
            font-weight: bold;
            color: #0077cc;
        }
    </style>
</head>
<body>

    <h1>Robot Delivery Report</h1>

    <div class="metric-grid">

         <!-- Start Time -->
        <div class="card">
            <div class="metric-title">Trip Start</div>
            <div class="metric-value">2025-11-27 21:19:21</div>
        </div>

        <!-- End Time -->
        <div class="card">
            <div class="metric-title">Trip End</div>
            <div class="metric-value">2025-11-27 21:22:33</div>
        </div>

        <!-- Trip Duration -->
        <div class="card">
            <div class="metric-title">Trip Duration</div>
            <div class="metric-value"> 191.89 seconds</div>
        </div>

        <!-- Current Battery -->
        <div class="card">
            <div class="metric-title">Current Battery Level</div>
            <div class="metric-value"> 91.90%</div>
        </div>

        <!-- Voltage -->
        <div class="card">
            <div class="metric-title">Voltage</div>
            <div class="metric-value"> 16.05 V</div>
        </div>

        <!-- Temperature -->
        <div class="card">
            <div class="metric-title">Temperature</div>
            <div class="metric-value"> 27.00 °C</div>
        </div>

        <!-- Wall-follow Time -->
        <div class="card">
            <div class="metric-title">Wall-following Time</div>
            <div class="metric-value"> 65.40 seconds</div>
        </div>
        
        <div class="card">
            <div class="metric-title">Average Wall Distance</div>
            <div class="metric-value">0.33 meters</div>
        </div>
        <!-- Battery Used -->
        <div class="card">
            <div class="metric-title">Battery Used During Trip</div>
            <div class="metric-value highlight"> 3.40%</div>
        </div>
    </div>
</body>
</html>
