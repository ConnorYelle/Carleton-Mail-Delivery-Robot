[project]
name = "mail-delivery-robot"
version = "0.1.0"
description = "ROS2 mail delivery robot control system"
requires-python = ">=3.10"

dependencies = [
    "ollama",
    "numpy",
    "black>=26.3.0",
    "ruff>=0.15.5",
    "isort>=8.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
